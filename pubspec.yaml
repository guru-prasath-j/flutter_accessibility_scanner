name: flutter_accessibility_scanner
description: Scan Flutter widget trees for WCAG 2.1 accessibility issues (missing labels, low contrast, small tap targets, focus) with fix hints and JSON reports.
version: 1.1.0
homepage: https://github.com/guru-prasath-j/flutter_accessibility_scanner
repository: https://github.com/guru-prasath-j/flutter_accessibility_scanner
issue_tracker: https://github.com/guru-prasath-j/flutter_accessibility_scanner/issues
topics:
  - accessibility
  - a11y
  - wcag
  - semantics
  - testing

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
